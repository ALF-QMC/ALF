name: "Tests"

on:
  push:
  workflow_dispatch:

concurrency:
  group: tests-ci-${{ github.ref }}
  cancel-in-progress: true


jobs:
  lint_stopcommands:
    name: Lint Fortran STOP statements
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@v6
      - name: Check for forbidden STOP/ERROR STOP
        run: |
          set -euo pipefail
          ! grep -irn -e "^\s*error\s*stop" -e "^\s*stop" --include="*.F90" \
            --exclude-dir=Analysis --exclude-dir=HDF5 --exclude-dir=testsuite \
            --exclude-dir=Not_supported --exclude="runtime_error_mod.F90" || {
            echo "STOP/ERROR STOP found."; exit 1;
          }

  report_use_only:
    name: Check USE statements without ONLY
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@v6
      - name: Fail on USE without ONLY in Prog/*.F90 (Hamiltonians excluded)
        # Enforced since refactoring step 1.34. Allowed without ONLY: the
        # external library interfaces mpi, hdf5, h5lt and alf_hdf5 (HDF5 builds
        # only), whose exported names differ between implementations.
        # Excluded files: Prog/Hamiltonians/ (user model templates, a later
        # phase) and Prog/matTypes_mod.F90 (not compiled).
        run: |
          files=$(git ls-files -- 'Prog/*.F90' ':!:Prog/Hamiltonians/*' ':!:Prog/matTypes_mod.F90')
          bad=$(grep -n -i -E '^\s*use[ ,]' $files | grep -v -i -E 'only\s*:' \
                | grep -v -i -E ':\s*use\s+(mpi|hdf5|h5lt|alf_hdf5)\s*(!.*)?$' || true)
          if [ -n "$bad" ]; then
            echo "USE statements without ONLY (add an ONLY list):"
            echo "$bad"
            exit 1
          fi
          echo "All USE statements in Prog/*.F90 (outside Hamiltonians/) have ONLY lists."
      - name: Fail on direct BLAS/LAPACK calls in the QMC core
        # Since refactoring step 6G.C10 the core calls the wrappers of
        # Libraries/Modules/linalg_mod.F90 (la_zgemm, ...), so that a GPU
        # backend changes one module. Excluded: Prog/Hamiltonians/ (user
        # models), Prog/Operator_mod.F90 (row/column scalings of the operators,
        # to be replaced by fused kernels in a GPU port) and
        # Prog/matTypes_mod.F90 (not compiled). Since 6G.E7 it also covers
        # the complex routines of Libraries/Modules/mymats_mod.F90 and the
        # LAPACK helpers zlaset, zlapmr, zlapmt and zgesvd, zheev, zgeev.
        run: |
          files="$(git ls-files -- 'Prog/*.F90' ':!:Prog/Hamiltonians/*' \
                   ':!:Prog/Operator_mod.F90' ':!:Prog/matTypes_mod.F90') Libraries/Modules/Mat_subroutines_mod.F90 \
                 Libraries/Modules/mymats_mod.F90"
          bad=$(grep -n -i -E '^[^!]*\bcall\s+z(gemm|hemm|trsm|trmm|gemv|geru|scal|copy|lacpy|getrf|getrs|getri|geqrf|geqp3|ungqr|unmqr|laset|lapmr|lapmt|gesvd|heev|geev)\s*\(' $files || true)
          if [ -n "$bad" ]; then
            echo "Direct BLAS/LAPACK calls (use the la_* wrappers of linalg_mod):"
            echo "$bad"
            exit 1
          fi
          echo "The QMC core calls BLAS/LAPACK only through linalg_mod."
      - name: Count USE statements without ONLY in Prog/
        # Report only: this job never fails. See refactoring step 0.14.
        run: |
          files=$(git ls-files -- 'Prog/*.F90' ':!:Prog/Hamiltonians/Not_supported/*')
          uses=$(grep -i -E '^\s*use[ ,]' $files || true)
          total=$(printf '%s\n' "$uses" | grep -c . || true)
          bare=$(printf '%s\n' "$uses" | grep -v -i -E 'only\s*:' | grep -c . || true)
          {
            echo "### USE statements in Prog/ (tracked *.F90, excluding Not_supported)"
            echo ""
            echo "- total: $total"
            echo "- without \`only:\`: $bare"
            echo ""
            echo "| count | file |"
            echo "|---:|---|"
            printf '%s\n' "$uses" | grep -v -i -E 'only\s*:' | cut -d: -f1 \
              | sort | uniq -c | sort -rn | awk '{print "| " $1 " | " $2 " |"}'
          } | tee -a "${GITHUB_STEP_SUMMARY:-/dev/null}"

  report_save_state:
    name: Report SAVE state (fails on implicit SAVE)
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@v6
      - name: Classify SAVE variables in Prog/ and Libraries/Modules/
        # Report: see refactoring step 0.15. Since step 2.13 the job fails if a
        # local variable is initialised in its declaration (implicit SAVE).
        # Heuristic, line based. Categories:
        #   local_save     explicit SAVE inside a procedure (hidden state)
        #   local_implicit local initialised in its declaration (implicit SAVE)
        #   module_save    explicit SAVE at module level (redundant; global state)
        run: |
          files=$(git ls-files -- 'Prog/*.F90' 'Libraries/Modules/*.F90' \
                  ':!:Prog/Hamiltonians/Not_supported/*')
          awk '
            FNR == 1 { depth = 0 }
            {
              line = $0; sub(/!.*/, "", line); l = tolower(line)
              if (l ~ /^[ \t]*end[ \t]*(subroutine|function)([ \t]|$)/) { if (depth > 0) depth--; next }
              if (l ~ /^[ \t]*end[ \t]*$/ && depth > 0) { depth--; next }
              if (l !~ /^[ \t]*end/ && l !~ /procedure/ &&
                  l ~ /(^|[ \t)])(subroutine|function)[ \t]+[a-z_][a-z0-9_]*/) { depth++; next }
              head = l; p = index(l, "::"); if (p > 0) head = substr(l, 1, p - 1)
              if ((p > 0 && head ~ /,[ \t]*save([ \t,]|$)/) || l ~ /^[ \t]*save[ \t]*$/ || l ~ /^[ \t]*save[ \t]*::/) {
                printf "%s\t%s:%d\n", (depth > 0 ? "local_save" : "module_save"), FILENAME, FNR; next
              }
              if (depth > 0 && l ~ /^[ \t]*(integer|real|complex|logical|character|type[ \t]*\(|class[ \t]*\()/ &&
                  l ~ /::[^=]*=[^>]/ && l !~ /parameter/) printf "local_implicit\t%s:%d\n", FILENAME, FNR
            }' $files > save_scan.txt
          {
            echo "### SAVE state in Prog/ and Libraries/Modules/ (tracked *.F90, excluding Not_supported)"
            echo ""
            for c in local_save local_implicit module_save; do
              echo "- $c: $(grep -c "^$c" save_scan.txt || true)"
            done
            echo ""
            echo "| category | count | file |"
            echo "|---|---:|---|"
            cut -d: -f1 save_scan.txt | sort | uniq -c | sort -k2,2 -k1,1rn \
              | awk '{print "| " $2 " | " $1 " | " $3 " |"}'
          } | tee -a "${GITHUB_STEP_SUMMARY:-/dev/null}"
      - name: Fail on implicit SAVE (local initialised in its declaration)
        # Use a PARAMETER for constants, or assign the value as an executable statement.
        run: |
          if grep '^local_implicit' save_scan.txt; then
            echo "::error::Local variables initialised in their declaration are implicitly SAVE'd. Use PARAMETER or an explicit assignment."
            exit 1
          fi

  # ======================
  # Linux tests
  # ======================

  test_linux:
    name: ${{ matrix.image_minor[0] }} · ${{ matrix.mode }} · ${{ matrix.devel }} · ${{ matrix.config }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image_minor:
          - [trixie, GNU]
          - [bookworm-pgi-24-09, PGI]
          - [bookworm-intel-2024.2, INTEL]
          - [bookworm-intel, INTELLLVM]
        mode: [noMPI, MPI, TEMPERING, PARALLEL_PARAMS]
        devel: ["Devel"]
        config: ["HDF5"]
    container:
      image: ghcr.io/alf-qmc/alf-container/alf-requirements/${{ matrix.image_minor[0] }}
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/alf_test
        with:
          args: ${{ matrix.image_minor[1] }} ${{ matrix.mode }} ${{ matrix.devel }} ${{ matrix.config }}

  test_macos:
    name: macOS · ${{ matrix.mode }} · ${{ matrix.devel }} · ${{ matrix.config }}
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        mode: [noMPI, MPI, TEMPERING, PARALLEL_PARAMS]
        devel: ["Devel"]
        config: ["HDF5"]
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/alf_test
        with:
          args: GNU ${{ matrix.mode }} ${{ matrix.devel }} ${{ matrix.config }}

  # ======================
  # MALA regressions
  # ======================
  mala_regressions:
    name: MALA measurements and caches (GNU serial)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        build: [optimized, debug]
    container:
      image: ghcr.io/alf-qmc/alf-container/alf-requirements/trixie
    steps:
      - uses: actions/checkout@v6
      - name: Build and test
        shell: bash
        env:
          BUILD: ${{ matrix.build }}
          OMP_NUM_THREADS: '1'
        run: |
          if [ "$BUILD" = debug ]; then
            export ALF_FLAGS_EXT='-O0 -fno-fast-math -g -fcheck=all -ffpe-trap=invalid,zero,overflow'
          fi
          . ./configure.sh GNU noMPI
          make -j2 all
          cmake -S testsuite -B testsuite/tests -DALF_MALA_TESTS=ON
          cmake --build testsuite/tests -j2
          ctest --test-dir testsuite/tests --output-on-failure

  # ======================
  # Valgrind
  # ======================
  valgrind_gnu_trixie:
    name: Valgrind GNU (trixie)
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/alf-qmc/alf-container/alf-requirements/trixie
    steps:
      - uses: actions/checkout@v6
      - name: Run Valgrind
        shell: bash
        run: |
          . ./configure.sh GNU devel noMPI
          gfortran -v
          make program
          cd Scripts_and_Parameters_files/test_valgrind
          valgrind --leak-check=full --errors-for-leak-kinds=definite,indirect,possible --error-exitcode=1 ../../Prog/ALF.out
