name: "ALF Test Template"
description: "General Test Template to be used in github actions for easy matrix workflows"
inputs:
  args:
    description: "Arguments for configure.sh: MACHINE MODE CONFIG_ARGS"
    type: string
    required: true
runs:
  using: "composite"
  steps:
    - name: macOS Toolchain install
      if: runner.os == 'macOS'
      id: mac_toolchain
      shell: bash
      run: |
        brew update
        brew install mpich
        gcc_version=$(brew list --versions gcc | grep -o '[0-9]\+' | head -1)
        bindir=$(brew --prefix)/bin
        ln -fs ${bindir}/gfortran-${gcc_version} /usr/local/bin/gfortran
        ln -fs ${bindir}/gcc-${gcc_version} /usr/local/bin/gcc
        ln -fs ${bindir}/g++-${gcc_version} /usr/local/bin/g++
        echo "gcc_version=$gcc_version" >> $GITHUB_OUTPUT

    - name: Get number of processors
      shell: bash
      run: |
        if [[ $(uname) == "Darwin" ]]; then
          NPROC=$(sysctl -n hw.ncpu)
        else
          NPROC=$(nproc)
        fi
        echo "There are $NPROC processors available."

    - name: Restore HDF5 cache
      if: runner.os == 'macOS'
      uses: actions/cache@v5
      with:
        key: macos-HDF5-${{ steps.mac_toolchain.outputs.gcc_version }}
        path: HDF5/*/

    - name: Build & Test
      shell: bash
      env:
        ARGS: ${{ inputs.args }}
        OMPI_MCA_mpi_cuda_support: '0'
      run: |
        . ./configure.sh $ARGS
        echo $ALF_FC
        $ALF_FC --version
        make all
        if echo "$MODE" | grep -iq -e "TEMPERING" -e "PARALLEL_PARAMS"; then
          cp -r Scripts_and_Parameters_files/Start_Tempering run
        else
          cp -r Scripts_and_Parameters_files/Start run
        fi
        cd run
        if echo "$MODE" | grep -iq -e "serial" -e "noMPI"; then
          "$ALF_DIR/Prog/ALF.out"
        else
          MPI_OPTS="-n 4"
          if mpiexec --version | grep -iq -e 'Open MPI' -e 'OpenRTE'; then MPI_OPTS="$MPI_OPTS --use-hwthread-cpus"; fi
          mpiexec $MPI_OPTS "$ALF_DIR/Prog/ALF.out"
        fi
        if echo "$MODE" | grep -iq -e "TEMPERING" -e "PARALLEL_PARAMS"; then cd Temp_0; fi
        if echo "$CONFIG_ARGS" | grep -iq "HDF5"; then
          "$ALF_DIR/Analysis/ana_hdf5.out"
        else
          "$ALF_DIR/Analysis/ana.out" *
        fi

    - name: Run unit tests
      shell: bash
      env:
        ARGS: ${{ inputs.args }}
      run: |
        . ./configure.sh $ARGS
        mkdir -p "$ALF_DIR/testsuite/tests"
        cd "$ALF_DIR/testsuite/tests"
        if echo "$ALF_FC" | grep -q "mpiifort -fc=ifx"; then exit 0; fi
        # The delayed-vs-immediate comparison drives ALF.out directly, the way a
        # plain noMPI leg builds it; it is opt-in via ALF_TEST_DELAYED so the
        # other legs (MPI, TEMPERING, PARALLEL_PARAMS) don't try to run it. An
        # HDF5 build needs h5diff on PATH to compare the .h5 output it
        # produces instead of confout_0 -- ALF vendors its own HDF5 build (see
        # configure.sh) rather than relying on one being preinstalled, so pick
        # up h5diff from there.
        if echo "$MODE" | grep -iq -e "serial" -e "noMPI"; then
          if [ -n "${HDF5_DIR:-}" ]; then PATH="$HDF5_DIR/bin:$PATH"; fi
          ALF_TEST_DELAYED=1 cmake ..
        else
          cmake ..
        fi
        cmake --build . --target all --config Release
        ctest -VV -O log.txt
        grep "tests passed" log.txt | cut -d " " -f 1